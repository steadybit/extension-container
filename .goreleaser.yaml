project_name: steadybit-extension-container
version: 2
before:
  hooks:
    - make licenses-report

release:
  prerelease: "false"

git:
  ignore_tags:
    - steadybit-extension-container-*

builds:
  - binary: extension-container
    env:
      - CGO_ENABLED=0
      - MEMFILL_VERSION=v1.5.0
      - NSMOUNT_VERSION=v1.1.1
      - DNS_INJECT_VERSION=v0.2.6
      - TRANSPARENT_PROXY_VERSION=v1.0.0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -cover={{ if index .Env "BUILD_WITH_COVERAGE"  }}{{ .Env.BUILD_WITH_COVERAGE }}{{ else }}false{{ end }}
      - -covermode=atomic
    ldflags:
      - -s -w
      - -X github.com/steadybit/extension-kit/extbuild.ExtensionName={{.ProjectName}}
      - -X github.com/steadybit/extension-kit/extbuild.Version={{.Version}}
      - -X github.com/steadybit/extension-kit/extbuild.Revision={{.Commit}}
    hooks:
      post: sh -c "curl -sfL \"https://github.com/steadybit/nsmount/releases/download/${NSMOUNT_VERSION}/nsmount.{{ .Arch }}\" -o \"./dist/nsmount.{{ .Arch }}\" && chmod a+x \"./dist/nsmount.{{ .Arch }}\" && curl -sfL \"https://github.com/steadybit/memfill/releases/download/${MEMFILL_VERSION}/memfill.{{ .Arch }}\" -o \"./dist/memfill.{{ .Arch }}\" && chmod a+x \"./dist/memfill.{{ .Arch }}\" && curl -sfL \"https://github.com/steadybit/dns-inject/releases/download/${DNS_INJECT_VERSION}/dns-inject_${DNS_INJECT_VERSION#v}_{{ .Arch }}.tar.gz\" | tar -xzOf - dns-inject > \"./dist/dns-inject.{{ .Arch }}\" && chmod a+x \"./dist/dns-inject.{{ .Arch }}\" && curl -sfL \"https://github.com/steadybit/transparent-proxy/releases/download/${TRANSPARENT_PROXY_VERSION}/transparent-proxy.{{ .Arch }}\" -o \"./dist/transparent-proxy.{{ .Arch }}\" && chmod a+x \"./dist/transparent-proxy.{{ .Arch }}\""

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-{{ .CommitTimestamp }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

nfpms:
  - package_name: "steadybit-extension-container"
    file_name_template: "{{ .ConventionalFileName }}"
    formats:
      - deb
      - rpm
    maintainer: "Johannes Edmeier <johannes.edmeier@steadybit.com>"
    description: |
      Steadybit Extension Container
    vendor: "steadybit GmbH"
    homepage: "https://steadybit.com"
    license: "Steadybit license"
    builds:
      - steadybit-extension-container
    dependencies:
      # procps provides /usr/bin/kill on debian/ubuntu, which the process
      # runners use to signal stress-ng / memfill / diskfill / dns-inject.
      - procps
      - stress-ng
      # iptables-restore / ip6tables-restore: network delay + tcp reset
      - iptables
      # ip + tc
      - iproute2
      # dig: resolving the network attack's target hostnames
      - bind9-dnsutils
      - runc
      # capsh, used by the sysv init.d script
      - libcap2-bin
    bindir: /opt/steadybit/extension-container
    contents:
      - src: ./linuxpkg/systemd
        dst: /usr/lib/systemd/system
      - src: ./linuxpkg/init.d
        dst: /etc/init.d
      - src: ./linuxpkg/config
        dst: /etc
        type: config
      - src: ./dist/nsmount.{{ .Arch }}
        dst: /opt/steadybit/extension-container/nsmount
      - src: ./dist/memfill.{{ .Arch }}
        dst: /opt/steadybit/extension-container/memfill
      - src: ./dist/dns-inject.{{ .Arch }}
        dst: /opt/steadybit/extension-container/dns-inject
      - src: ./dist/transparent-proxy.{{ .Arch }}
        dst: /opt/steadybit/extension-container/transparent-proxy
      - src: ./licenses
        dst: /opt/steadybit/extension-container/licenses

    scripts:
      preinstall: ./linuxpkg/scripts/preinstall.sh
      postinstall: ./linuxpkg/scripts/postinstall.sh
      preremove: ./linuxpkg/scripts/preremove.sh
      postremove: ./linuxpkg/scripts/postremove.sh

    rpm:
      signature:
        key_file: ./gpg.key
    deb:
      signature:
        key_file: ./gpg.key

    overrides:
      rpm:
        dependencies:
          - /usr/bin/stress-ng
          - iproute-tc
          - /usr/sbin/ip
          - /usr/sbin/iptables-restore
          - /usr/bin/fallocate
          - /usr/bin/dig
          - runc
          - libcap
        recommends:
          - kernel-modules-extra
